# The efficiency view's authorship gate (bot-01's 0.80): no prize rides on that view.
min_authored_coverage: 0.8

# A placement prize needs a score above the gate baseline's: the reference forge's, entered as a house entry 4 hours
# before the deadline and flagged baseline (server/payouts/baseline.ts). An agent/v1 run's rank-key value is a mean
# over the final's 3 shared instances, so the gate is the 90% paired t-interval of the per-instance lead above 0
# besides the value rule: an interval that reaches 0 is a statistical tie, and a tie does not beat it. The final's
# cut is cut-exempt for the baseline (server/grading/final-cut.ts cutExempt): it always goes on to all 3 instances
# whatever it scored, and takes none of the 60 contender seats.
prize_requires_beating_baseline: true

# A house entry or baseline that finishes in a paid place holds the place, unpaid, and no entry moves up: the rules'
# Prizes section says so, word for word (contest-design.mdc). The baseline never beats itself, so the reference forge
# holds the place it finishes in rather than taking a prize.
house_holds_places: true

# Open and public, so every automation job sweeps it: lifecycle locks and resolves at the deadline, and the
# fund-at-open job moves the whole $500 into the escrow when it opens (automation.escrow: at_open).
automation:
  lifecycle: true
  payouts: auto
  escrow: at_open
