# GitHub core clone 01: an agent/v1 competition whose entry is a standalone, GitHub-compatible git forge. Each trial
# runs the entry as one process in a pod beside the sealed suite; the suite drives it as a client (git smart HTTP,
# the REST v3 API, GraphQL and MCP) and times four workloads, and a sealed scorer turns the suite's exports into a
# score out of 1,000. Sealed: the draft is renamed competition.yaml, BUNDLE_PENDING is deleted, competition.status is
# open and visibility public, the slug is registered and the three sealed digests are taken from the trees that ship
# (.cosmos/rules/contest-design.mdc: landing an at_open bundle on main seeds it, funds its escrow and seals it; a seed
# then refuses any change to its rules, server/db/seed/competitions.ts refuseRulesChange). Its bytes never change
# again once it opens. tests/unit/comp-github-core-clone-01.test.ts holds the bundle, its rules' quotes and its
# grading end to end.
#
# The owner's ask (2026-11-13, verbatim): "Best core github clone, git standalone proj, grade on performance, feature
# completion, agentic native support etc". The root's contract (#1): a server an agent can run as one process,
# serving the four surfaces agents already speak, graded on conformance, on the MCP arm and on speed, with the same
# task and the same suite for every entry.
#
# Why the winner beats the public alternatives: the public forges (GitHub, GitLab, Gitea and Forgejo) are multi-service
# products with a UI, a database and an operator; none of them is one process an agent starts inside a sandbox. The
# winning entry serves git smart HTTP v2, the REST v3 routes the suite drives, GraphQL and MCP from one process over
# its own store, passes the suite's conformance checks and beats the reference forge's times on the four timed
# workloads. It is a new, small forge, not a wrapper: the suite drives the routes and the MCP tools themselves, so a
# UI or a copy of another product's code answers none of them.
#
# The bundle's directories:
#   env/            the sealed suite, built from the competition's sources by scripts/competitions/build-agent-bundle.ts
#                   into env/server.mjs: it listens on 8080, serves /register and /done, runs the conformance checks,
#                   the four timed workloads and the export. env/src/wire.ts holds the wire contract and the seeded
#                   scenario; env/src/manifest.ts the check groups, the four workloads and the scoring constants;
#                   env/src/bench.ts the workloads; env/src/main.ts the lifecycle and the deadline.
#   generator/      the sealed generator, built into generator/draw.mjs: one instance a trial from the drand seed,
#                   writing /input and /reference. All scenario data derives from one constant seed in env/src/wire.ts,
#                   so a live run and its replay see byte-identical data.
#   scorer/         the sealed scorer, built from src/scorer/main.ts into scorer/score.mjs (esbuild, one self-contained
#                   ES module run on node22; the arithmetic in scorer/score.ts, the columns in scorer/columns.ts): it
#                   reads /state/export/state.json and perf.json and writes /scores/scores.json (working, feature,
#                   agent, perf, score, perf_p50_us). scorer/main.ts runs the same arithmetic natively.
#   starter/        the kit's working skeleton: a Node 22 server that binds an ephemeral port, registers it, serves a
#                   minimal git smart HTTP and REST surface and long-polls /done.
#   sdk/            the same suite shipped in the kit with a local runner, byte-identical to the sealed copy.
#   house.yaml      schema agent-fun/house-entries/v1, naming baseline/, the reference forge: the automation enters
#                   it as a house entry 4 hours before the deadline, flagged as the baseline, the bar a prize must beat
#                   (prize_requires_beating_baseline). It always goes on to the final whatever it scores and takes none
#                   of the 60 contender seats (server/grading/final-cut.ts cutExempt), it holds the place it finishes in
#                   without taking that place's prize (house_holds_places), and a statistical tie with it does not beat
#                   it (server/payouts/baseline.ts). It lands with the baseline itself before the seal.
#   instance.yaml   the trials sidecar: the practice round (drawn before the opening) and the scored round the final
#                   draws (the first drand quicknet round at or after the final phase's start).
#
# The house entry: house.yaml names baseline/ (the reference forge, copied to baseline/entry for the kit). The
# house-entries automation enters it automatically 4 hours before the deadline, at 2026-11-21T02:30:00Z
# (server/competitions/house-entry-due.ts houseEntryDueAt: deadline less the shorter of 4 hours and half the entry
# window), flagged baseline, and never at the opening. The final's lock REFUSES without a ranked baseline
# (server/competitions/lifecycle/finalize.ts refuseWithoutBaseline): with none among the entries its grading covers, its
# standings cannot compute (payouts/standings.ts BASELINE_MISSING) and no prize could be paid, so the deadline cannot
# pass into a final without it. If it did not enter, this is the recovery, run against the running overlay:
#   deploy/k8s/makefun-k8s.sh -o makefun-prod admin-enter-baseline --slug github-core-clone-01 \
#     --dir competitions/github-core-clone-01/baseline/entry --actor <admin handle> --now
# (scripts/competitions/enter-house-baseline.ts; --now is the operator's override of the due time; the job writes the
# entry and the pipeline grades it like any entry).
# Scoring (env/src/manifest.ts, src/scorer/main.ts with scorer/score.ts and scorer/columns.ts;
# tests/unit/comp-github-core-clone-01-scorer.test.ts and #19's report): the suite's checks are grouped git (30),
# repos (15), issues (15), pulls (20), graphql (20), mcp (15) and
# protocol (5), 120 at most, each pass or fail. feature = round(600 * passed / total), 0 to 600. agent =
# round(200 * passedMcp / totalMcp), the MCP group's own count, 0 to 200. perf = the sum over the four workloads of
# round(clamp(25 - 12.5 * log2(t_ms / T_ref_ms), 0, 50)), 0 to 200, where t is the workload's median of 3 rounds and
# T_ref is the house reference forge's calibrated median, measured on the production sandbox before entries open and
# sealed in env/src/calibration.json; manifest.ts reads its four measured medians into T_REF_MS and the build inlines
# them into env/server.mjs, so the sealed suite and the kit score the same column (the kit carries the same figures,
# so an entrant can compute a local score). score = feature + agent + perf, 0 to 1,000. state.json holds only
# pass/fail bits and counts, never a time, a port or a date, so the replay's export compares byte for byte; the
# timings live in perf.json alone. perf_p50_us =
# round(1000 * the geometric mean of the four workloads' p50_ms), the tie-break column, lower first.
#
# The tie-break chain (.cosmos/rules/contest-design.mdc): exactly equal scores go to the lower perf_p50_us, then to the
# earlier receipt. Build cost never breaks a tie.
#
# The three sealed digests are treeSha256 of each program's directory (load.ts treeSha256): env/ with env/src/ and
# env/server.mjs once it is built, scorer/ with src/scorer/main.ts, scorer/{main,score,columns}.ts and the built
# scorer/score.mjs, and generator/ with generator/draw.mjs, whose build (src/generator/main.ts and brief.ts) is
# drift-free (build-agent-bundle.ts --check). The figures below are the trees that ship, taken with treeSha256 at the
# seal and re-checked by the preflight on this bundle (which exits 0): a bundle lands only with the real figures, and
# no tree moves after it opens.
#
# instance.yaml is drawn by the tool, never by hand (an agent/v1 bundle is always instance-drawn, one instance a
# trial), with the generator built and its digest pinned:
#   node scripts/competitions/instance.ts practice --competition github-core-clone-01 \
#     --round 33447412 --signature a8159aef98227c2cd0d45cd3ce5d2211171d3fd4dd8f174d65b36d7fa005211084e61d2b9988cb8026a98a0aa4f00fe8 \
#     --cpus 2 --memory-mb 1024 --pids 256 --wall-budget-sec 900
# (drand quicknet round 33447412, emitted 2026-10-28T00:00:00Z, before this bundle opens; chess-engine-01 and
# dropship-store-agent-01 draw their practice instances from it too). instance.yaml beside this bundle commits the
# three practice trials and the scored beacon; its practice trees are drawn into the sealed directory, and the
# loader checks them there when the dev phase grades on them.
#
# Money: $500 on the release's twenty-place table ($100, $70, $50, $20 each for 4th to 10th and $14 each for 11th to
# 20th, tests/unit/catalogue.test.ts CATALOGUE_TABLES), paid by the house in USDC on Solana, one place per entrant,
# full automation (automation.lifecycle true, payouts auto) and the escrow funded at open (automation.escrow:
# at_open): the worker moves the whole $500 into the competition's escrow when it opens, and the rules' Entries, Payout
# and the criteria's and announcement's payout lines say both outcomes in the btc-race release template's words
# (server/releases/templates/btc-race.ts). No challenge window is named (the owner, 2026-11-10).
#
# Dates (the root's, 2026-11-13; every one a whole UTC hour or half hour): opens_at 2026-11-14T06:30:00Z (a Saturday),
# the deadline 2026-11-21T06:30:00Z (7 days of entries, a server build's size), the final phase 2026-11-21T06:40:00Z to
# 18:40:00Z (10 minutes after the deadline, the commit window an escrow open takes, and 12 hours: the 2,000-entry
# worst case is 9.52 h, so an 8-hour window was too tight; the qualifying trial
# of every final entry, then each of the 60 contenders' 3 trials live and replayed, sized inside the final's window).
# The practice trials are drawn from a public drand quicknet round emitted before the opening; the scored instances
# from the first round emitted at or after the final phase's start. This is the first contest of its size, so there is
# no last final's deadline-to-result time to quote; the 12-hour phase is the design's bound, and the header's figures
# are read again after the first final.
#
# Grading load: this bundle adds no harness path. A trial is the platform's agent/v1 trial (grader/agent.ts), one pod
# on the `pod` layout (grader/sandbox/layout.ts). The per-entry events it runs (a submission, a transcript ingest, a
# dev grade landing, a final grade landing, an audit and a heat step) are the platform's agent/v1 handlers: each reads
# the entry's own rows or a fixed set of phase rows, and none reads the phase's whole field; the suite's checks run
# inside the trial, and a grade landing sends the phase's followers as every agent/v1 bundle's do. So no rig proof is
# owed for a new path, and the platform's own agent/v1 rig proof stands for the trial. Priced on 2026-11-13 by server/competitions/grading-budget.ts at 2,000 entries and 64 trial
# slots, with no sizing file (live play at wall / 3 = 300 s a trial): the final is 3.53 hours expected and 9.52 worst
# (the qualifier 3.13 / 8.33, the staged 60's two further trials 0.33 / 0.96, their replays 0.07 / 0.23), and a dev
# trial is 360 slot-seconds, 0.26 lane-days a day at 4,000 grades a day. gradingBudgetIssueList returns no issue. The
# preflight's pod-footprint line, on the same day's live figures, prices the final at 64 sandbox pods at once (2,180
# pods made, 407 pod-seconds an entry at 2,000 entries; 64 at once, 20,180 made, 365 pod-seconds an entry at 20,000),
# which fits s9's 250 beside the live contests' 48 and s18's 40 timed pods and 146 places in all (82 its own).
#
# The seal: once competition.yaml is committed and seeded, its bytes never change (server/competitions/load.ts,
# server/db/seed/competitions.ts refuseRulesChange), so every number the rules quote is fixed before it opens.
version: 1

competition:
  slug: github-core-clone-01
  title: Build a GitHub-compatible git forge
  summary: "Build a standalone GitHub-compatible git forge: no UI, one process that serves git smart HTTP, the REST v3 API, GraphQL and MCP from its own store; a sealed suite drives it as a client and scores its conformance checks and four timed workloads, and places go by score, best first, so the highest score wins 1st place; the reference forge is entered as a house entry in the last hours, it always goes on to the final whatever it scores and takes none of the 60 seats, and a prize needs a score above it (a statistical tie with it does not beat it), so beating it only qualifies an entry for a place; it holds the place it finishes in and never takes that place's prize, and 20 places pay $100 / $70 / $50 / $20 x7 / $14 x10 = $500."
